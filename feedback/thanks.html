<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>谢谢您 · Thank you</title><style>
:root{--teal:#1A6B7A;--teal-d:#14535f;--coral:#E8724A;--tint:#E3F0F2;--cream:#FDF4EB;--ink:#212121;--sub:#5b6668;--line:#d6e0e2;--bg:#ffffff;--card:#F6F9F9}
@media (prefers-color-scheme:dark){:root{--teal:#5FB3C2;--teal-d:#3d8f9e;--coral:#F08C68;--tint:#183338;--cream:#2b231d;--ink:#eef2f2;--sub:#a9b6b8;--line:#33464a;--bg:#111819;--card:#172124;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.35}
.zh{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","Noto Sans CJK SC",sans-serif;font-style:normal}
small{display:block;color:var(--sub);font-size:14px;font-weight:400}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
header{background:#1A6B7A;color:#fff}
header .wrap{display:flex;gap:16px;align-items:center;padding-top:20px;padding-bottom:20px}
header img{width:72px;height:72px;border-radius:10px;background:#fff;flex:none}
header h1{margin:0;font-weight:400}
header h1 .zh{display:block;font-size:34px;line-height:1.2}
header h1 small{color:#dff0f2;font-size:18px}
.intro{background:var(--cream);border-left:5px solid var(--coral);padding:16px 18px;margin:20px 0 4px;border-radius:0 8px 8px 0}
.intro .zh{font-size:22px;line-height:1.5;display:block}
.intro small{margin-top:8px;font-size:15px}
h2{margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--coral);color:var(--teal);font-weight:400}
h2 .zh{font-size:30px}
h2 small{display:inline;color:var(--teal);font-size:17px;margin-left:10px}
.lab{margin:18px 0 8px}
.lab b{font-size:26px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:block;border:2px solid var(--line);border-radius:12px;padding:10px 16px;min-width:110px;background:var(--bg)}
.chip b{font-size:26px;font-weight:400;display:block;line-height:1.25}
.chip input:checked+span{border-color:var(--teal);background:var(--tint);box-shadow:inset 0 0 0 1px var(--teal)}
.chip input:checked+span b::before{content:"✓ ";color:var(--teal);font-weight:700}
.chip input:focus-visible+span,.rt input:focus-visible+.dot{outline:3px solid var(--coral);outline-offset:2px}
fieldset.q{border:0;margin:0;padding:16px 10px;border-top:1px solid var(--line)}
fieldset.q:nth-of-type(even){background:var(--card)}
legend{display:flex;gap:10px;padding:0;margin-bottom:10px;float:left;width:100%}
legend b{font-size:26px;font-weight:700;line-height:1.3;display:block}
.num{color:var(--coral);font-weight:700;font-size:24px;min-width:28px}
.rts{clear:both;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:560px}
.rt{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;position:relative}
.rt input{position:absolute;opacity:0;pointer-events:none}
.dot{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--teal);display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--teal);background:var(--bg)}
.rt.na .dot{border-color:var(--sub);color:var(--sub)}
.rt input:checked+.dot{background:var(--teal);color:#fff}
.rt.na input:checked+.dot{background:var(--sub);color:var(--bg)}
.rt .zh{font-size:20px;margin-top:4px;min-height:1.3em}
.rt small{font-size:12px}
textarea,input[type=text],input[type=date],input[type=tel]{width:100%;font:inherit;font-size:22px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:130px}
textarea:focus,input:focus{outline:none;border-color:var(--teal)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}.dot{width:44px;height:44px}.rt .zh{font-size:17px}header h1 .zh{font-size:28px}}
button{margin-top:28px;width:100%;border:0;border-radius:14px;background:var(--coral);color:#fff;font:inherit;padding:18px;cursor:pointer}
button .zh{font-size:28px;display:block}
button small{color:#fff;opacity:.9}
.foot{margin-top:28px;font-size:13px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:12px}
.foot img{width:56px;border-radius:6px;background:#fff}
.hp{position:absolute;left:-9999px}

.big{text-align:center;padding:60px 0} .big .zh{font-size:44px;color:var(--teal);display:block} .big p{font-size:22px}</style></head><body>
