<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kogarah Term Diary — St Paul's Kogarah</title>
<meta name="description" content="Church calendar for St Paul's Anglican Kogarah, October 2026 to February 2027 — Sundays, G7 meetings, the Welcome Pathway and milestones. English / 简体中文.">
<link rel="icon" href="calendar-icon.svg" type="image/svg+xml">
<link rel="icon" href="calendar-icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="calendar-icon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="calendar-icon-180.png">
<meta name="theme-color" content="#0E1A2B">
<meta property="og:title" content="Kogarah Term Diary">
<meta property="og:description" content="St Paul's Kogarah, October 2026 to February 2027 — Sundays, G7 meetings, the Welcome Pathway and milestones.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  --ground:#FDF6EC;
  --surface:#FFFCF6;
  --surface-2:#F6EDE0;
  --sunk:#F1E5D3;
  --ink:#1B2440;
  --ink-2:#2C3E50;
  --muted:#7A6D5C;
  --faint:#9C8F7E;
  --line:#E3D7C6;
  --line-strong:#D2C2AB;
  --coral:#E8714A;
  --coral-soft:#FBE3D8;
  --teal:#2D7B8C;
  --teal-soft:#DCEBEE;
  --gold:#C8962E;
  --gold-soft:#F6E9CC;
  --green:#3F7D53;
  --green-soft:#DEEBE1;
  --shadow:0 1px 2px rgba(27,36,64,.05), 0 8px 24px -16px rgba(27,36,64,.25);
  --display:"Newsreader","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Public Sans","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12172A;
    --surface:#1B2440;
    --surface-2:#222C4D;
    --sunk:#182039;
    --ink:#F4EBDD;
    --ink-2:#DFD5C6;
    --muted:#A9A091;
    --faint:#8C8474;
    --line:#2F3A5F;
    --line-strong:#3D4A74;
    --coral:#F4906C;
    --coral-soft:#3A2A2A;
    --teal:#6FBDCD;
    --teal-soft:#1D3340;
    --gold:#E2B75C;
    --gold-soft:#332A18;
    --green:#7FBF93;
    --green-soft:#1D2F24;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#12172A;
  --surface:#1B2440;
  --surface-2:#222C4D;
  --sunk:#182039;
  --ink:#F4EBDD;
  --ink-2:#DFD5C6;
  --muted:#A9A091;
  --faint:#8C8474;
  --line:#2F3A5F;
  --line-strong:#3D4A74;
  --coral:#F4906C;
  --coral-soft:#3A2A2A;
  --teal:#6FBDCD;
  --teal-soft:#1D3340;
  --gold:#E2B75C;
  --gold-soft:#332A18;
  --green:#7FBF93;
  --green-soft:#1D2F24;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:0 72px}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:3px}

/* ---------- masthead ---------- */
.masthead{padding-block:40px 20px;border-bottom:2px solid var(--ink);margin-bottom:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:500}
.masthead h1{font-size:clamp(34px,6vw,52px);line-height:1.02;margin-top:8px}
.masthead .sub{font-family:var(--display);font-style:italic;font-size:clamp(16px,2.4vw,19px);color:var(--muted);margin-top:10px;max-width:60ch}
.masthead-foot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;margin-top:18px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong);display:inline-block}

/* ---------- countdown rail ---------- */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ground);border-bottom:1px solid var(--line);margin-inline:-20px;padding-inline:20px;padding-block:10px 11px}
.rail-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rail-title{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rail-track{display:flex;gap:8px;overflow-x:auto;padding-top:9px;scrollbar-width:thin}
.rail-track::-webkit-scrollbar{height:4px}
.rail-track::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
.cd{flex:0 0 auto;display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:7px;overflow:hidden;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.cd:hover{border-color:var(--coral);transform:translateY(-1px)}
.cd .n{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px 9px;background:var(--coral);color:#fff;min-width:50px}
.cd .n b{font-family:var(--mono);font-size:17px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.cd .n span{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-top:2px}
.cd.today .n{background:var(--ink)}
.cd.w2 .n{background:var(--teal)}
.cd.w3 .n{background:var(--gold);color:#3a2b06}
.cd .t{padding:6px 12px 6px 10px;display:flex;flex-direction:column;justify-content:center}
.cd .t b{font-weight:600;font-size:13px;line-height:1.25;white-space:nowrap}
.cd .t span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em}
.rail-empty{font-size:13px;color:var(--muted);font-style:italic;padding-top:9px;font-family:var(--display)}

/* ---------- section furniture ---------- */
section{padding-block:44px 0}
.sec-head{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:22px}
.sec-head h2{font-size:24px}
.sec-head .note{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-left:auto;white-space:nowrap}

/* ---------- month ---------- */
.month{margin-bottom:34px}
.month-bar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:8px;margin-bottom:2px}
.month-bar h3{font-size:19px;letter-spacing:.01em}
.month-bar .theme{font-family:var(--display);font-style:italic;font-size:14.5px;color:var(--teal)}
.month-rule{height:1px;background:var(--line);flex:1;min-width:24px;align-self:center}

/* ---------- day row ---------- */
.day{display:grid;grid-template-columns:96px 1fr;gap:0;border-top:1px solid var(--line);position:relative}
.day:last-child{border-bottom:1px solid var(--line)}
.day.past{opacity:.5}
.day.major{background:linear-gradient(90deg,var(--coral-soft),transparent 62%)}
.day.major::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--coral)}
.day.milestone{background:linear-gradient(90deg,var(--gold-soft),transparent 62%)}
.day.milestone::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.daymark{padding:16px 14px 16px 14px;border-right:1px solid var(--line)}
.day.major .daymark,.day.milestone .daymark{border-right-color:var(--line-strong)}
.dm-num{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.dm-dow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.dm-lit{font-family:var(--display);font-style:italic;font-size:12.5px;color:var(--teal);margin-top:7px;line-height:1.25}
.dm-term{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.daybody{padding:16px 4px 18px 16px;min-width:0}

.service{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.svc-passage{font-family:var(--display);font-size:18px;font-weight:500}
.svc-meta{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted)}
.svc-line2{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.svc-line2 em{font-family:var(--display);font-style:italic;color:var(--faint)}

/* ---------- event cards ---------- */
.events{display:flex;flex-direction:column;gap:8px;margin-top:13px}
.ev{border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:0 7px 7px 0;background:var(--surface);padding:10px 12px}
.ev.is-special{border-left-color:var(--coral);background:var(--surface)}
.ev.is-major{border-left-color:var(--coral);border-left-width:5px;box-shadow:var(--shadow)}
.ev.is-done{background:var(--sunk);border-left-color:var(--green)}
.ev-top{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ev-title{font-weight:600;font-size:14.5px;line-height:1.3;flex:1;min-width:140px}
.ev.is-done .ev-title{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}
.ev-when{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em;white-space:nowrap;padding-top:2px}
.ev-detail{font-size:12.8px;color:var(--muted);margin-top:5px;line-height:1.45}
.ev-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px}

.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;padding:3px 8px;border-radius:20px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);cursor:pointer;line-height:1.5}
.chip.team{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.chip.stage{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);text-decoration:none}
.chip.team{text-decoration:none}
.chip.pathway{border-color:var(--line-strong);color:var(--faint);background:transparent}
.chip.flag{border-color:var(--coral);color:var(--coral);background:var(--coral-soft)}
.chip.static{cursor:default}
.chip.status{font-weight:600}
.chip.status[data-v="done"]{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.chip.status[data-v="ready"]{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.cd-pill{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--coral);color:#fff;line-height:1.5;font-variant-numeric:tabular-nums}
.cd-pill.w2{background:var(--teal)}
.cd-pill.w3{background:var(--gold);color:#3a2b06}
.cd-pill.today{background:var(--ink);color:var(--ground)}
.cd-pill.gone{background:transparent;color:var(--faint);border:1px solid var(--line-strong)}
.x{margin-left:auto;background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;font-family:var(--body)}
.x:hover{color:var(--coral)}
.addbtn{align-self:flex-start;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px dashed var(--line-strong);color:var(--faint);border-radius:6px;padding:5px 10px;cursor:pointer}
.addbtn:hover{border-color:var(--coral);color:var(--coral)}

/* ---------- editable ---------- */
[contenteditable]{border-radius:3px;outline:none}
[contenteditable]:hover{background:var(--surface-2);box-shadow:0 0 0 3px var(--surface-2)}
[contenteditable]:focus{background:var(--surface-2);box-shadow:0 0 0 3px var(--surface-2),inset 0 -1px 0 var(--coral)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--faint);font-style:italic}
.ro [contenteditable]{pointer-events:none}
.ro .x,.ro .addbtn,.ro .chip.status{display:none}

/* ---------- pathway ---------- */
.pathway{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.pstep{padding:16px 16px 18px;border-right:1px solid var(--line);position:relative}
.pstep:last-child{border-right:none}
.pstep-n{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.pstep h4{font-size:17px;margin-top:6px}
.pstep .zh{font-family:"Noto Sans SC",var(--body);font-size:12.5px;color:var(--teal);margin-top:2px}
.pstep ul{list-style:none;margin:11px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.pstep li{font-size:12.6px;color:var(--muted);padding-left:13px;position:relative;line-height:1.4}
.pstep li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--teal)}
.pstep .owner{margin-top:12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;align-items:center}
.stage{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:4px 9px;background:var(--surface)}
.arrow{color:var(--line-strong);font-size:12px}

/* ---------- milestones ---------- */
.mgroup{margin-bottom:26px}
.mgroup-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mgroup-head h3{font-size:17px}
.mgroup-head .due{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);font-weight:500}
.mgroup-head .horizon{font-family:var(--display);font-style:italic;font-size:13.5px;color:var(--muted)}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:8px}
.ms{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--surface);display:flex;flex-direction:column;gap:7px;border-top:3px solid var(--line-strong)}
.ms[data-s="achieved"]{border-top-color:var(--green)}
.ms[data-s="progress"]{border-top-color:var(--teal)}
.ms[data-s="attempted"]{border-top-color:var(--gold)}
.ms[data-s="planned"]{border-top-color:var(--line-strong)}
.ms-title{font-weight:600;font-size:14px;line-height:1.3}
.ms-note{font-size:12.4px;color:var(--muted);line-height:1.45}
.ms-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:2px}
.sbadge{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;cursor:pointer;border:1px solid;line-height:1.5}
.sbadge[data-s="achieved"]{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.sbadge[data-s="progress"]{color:var(--teal);border-color:var(--teal);background:var(--teal-soft)}
.sbadge[data-s="attempted"]{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.sbadge[data-s="planned"]{color:var(--faint);border-color:var(--line-strong);background:transparent}
.ms-when{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint)}

/* ---------- teams ---------- */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:9px}
.team{border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;background:var(--surface);padding:12px 14px}
.team h4{font-size:16px}
.team h4 .zh{font-family:"Noto Sans SC",var(--body);font-size:13px;color:var(--teal);font-weight:400;margin-left:6px}
.team .brief{font-size:12.4px;color:var(--muted);margin-top:4px;line-height:1.45}
.team .people{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.person{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);text-decoration:none;border:1px solid transparent}
.person:hover{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.person.noaddr{color:var(--faint);cursor:default}
.teamlinks{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px}
.team .mailall{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);text-decoration:none;border-bottom:1px solid var(--teal);padding-bottom:1px}
.team .mailall:hover{color:var(--coral);border-color:var(--coral)}
.toplinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.toplink{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:7px 13px;background:var(--surface)}
.toplink:hover{border-color:var(--coral);color:var(--coral)}
.toplink b{font-size:13px;font-weight:400}
/* the current page keeps its place in the row but is not a link */
.toplink[aria-current="page"]{border-style:dashed;color:var(--muted);background:transparent;cursor:default}
.toplink[aria-current="page"]:hover{border-color:var(--line-strong);color:var(--muted)}

/* ---------- rhythm + agenda ---------- */
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.panel{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:16px 18px 18px}
.panel h3{font-size:17px;margin-bottom:3px}
.panel .psub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
.rhythm{display:flex;flex-direction:column;gap:0}
.rrow{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.rrow:first-child{border-top:none}
.rrow .rt{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);padding-top:2px}
.rrow .rd strong{font-weight:600}
.rrow .rd span{color:var(--muted);font-size:12.3px}
.agenda{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:13.3px}
.agenda li::marker{font-family:var(--mono);font-size:11px;color:var(--coral)}
.agenda li span{color:var(--muted)}

/* ---------- open items ---------- */
.openlist{display:flex;flex-direction:column;gap:8px}
.oi{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--coral);border-radius:0 7px 7px 0;background:var(--surface);padding:10px 12px}
.oi .txt{flex:1;font-size:13.2px;line-height:1.45}
.oi .who{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap;padding-top:2px}

/* ---------- footer ---------- */
footer{margin-top:52px;padding-top:18px;border-top:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.savechip{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:60;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:6px 12px;border-radius:20px;background:var(--ink);color:var(--ground);opacity:0;transition:opacity .25s;pointer-events:none}
.savechip.show{opacity:1}
.savechip.warn{background:var(--coral);color:#fff}

@media (max-width:560px){
  .day{grid-template-columns:1fr}
  .daymark{border-right:none;border-bottom:1px solid var(--line);padding:13px 14px 11px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
  .dm-num{font-size:21px}

const SCRIPTURE = {"Genesis": "创世记", "Psalm": "诗篇", "Psalms": "诗篇", "Isaiah": "以赛亚书", "Daniel": "但以理书", "Matthew": "马太福音", "Mark": "马可福音", "Luke": "路加福音", "John": "约翰福音", "Acts": "使徒行传", "Romans": "罗马书", "1 Corinthians": "哥林多前书", "2 Corinthians": "哥林多后书", "Galatians": "加拉太书", "Ephesians": "以弗所书", "Philemon": "腓利门书", "Revelation": "启示录"};
const MONTHS_ZH = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
const DOW_ZH = ["日", "一", "二", "三", "四", "五", "六"];

let lang = "en";
try{ const saved = localStorage.getItem("kogdiary.lang"); if(saved) lang = saved; }catch(e){}

function t(s){
  if(s==null||s==="") return "";
  const hit = ZH[s];
  if(hit) return hit;
  return scripture(s);
}
function scripture(s){
  let out = s, changed = false;
  for(const [en,zh] of Object.entries(SCRIPTURE)){
    if(out.indexOf(en)===0 || out.indexOf(" "+en)>-1){
      const next = out.split(en).join(zh);
      if(next!==out){ out = next; changed = true; }
    }
  }
  return changed ? out : s;
}
/* block-level bilingual: English, then Chinese on its own line */
function bi(s){
  if(s==null||s==="") return "";
  const zh = t(s);
  if(lang==="en" || zh===s) return esc(s);
  if(lang==="zh") return esc(zh);
  return esc(s)+'<span class="zhline">'+esc(zh)+'</span>';
}
/* inline bilingual: English ／ Chinese on one line */
function bic(s){
  if(s==null||s==="") return "";
  const zh = t(s);
  if(lang==="en" || zh===s) return esc(s);
  if(lang==="zh") return esc(zh);
  return esc(s)+'<i class="zhin">'+esc(zh)+'</i>';
}
/* plain string — labels stay English unless the page is fully in Chinese */
function tp(s){ return lang==="zh" ? t(s) : s; }

function setLang(v){
  lang = v;
  try{ localStorage.setItem("kogdiary.lang", v); }catch(e){}
  document.documentElement.setAttribute("data-lang", v);
  document.querySelectorAll("[data-lang-btn]").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.langBtn===v));
  });
  renderStatic(); renderAll(); renderPathway(); renderTeams();
}

function allEventsFor(day){
  const base = (day.events||[]).map(e=>Object.assign({},e,{custom:false}));
  const extra = Object.entries(state.custom)
    .filter(([,v])=>v && v.date===day.d)
    .map(([id,v])=>({id,t:v.t||"",when:v.when||"",team:v.team||"",path:v.path||"",kog:v.kog||"",w:v.w||"special",detail:v.detail||"",status:v.status||"planned",custom:true}));
  return base.concat(extra).filter(e=>{
    const o = state.events[e.id];
    return !(o && o.hidden);
  });
}
function hiddenCount(){
  return Object.values(state.events).filter(o=>o&&o.hidden).length;
}

function evView(e){
  const o = state.events[e.id] || {};
  return {
    id:e.id, custom:e.custom, w:e.w, flag:e.flag,
    t: o.t !== undefined ? o.t : e.t,
    when: o.when !== undefined ? o.when : e.when,
    detail: o.detail !== undefined ? o.detail : e.detail,
    team: o.team !== undefined ? o.team : e.team,
    path: e.path, kog: e.kog,
    status: o.status || e.status || "planned"
  };
}

function cdClass(n){ if(n<0) return "gone"; if(n===0) return "today"; if(n<=7) return ""; if(n<=14) return "w2"; if(n<=21) return "w3"; return "far"; }
function cdText(n){
  if(n<0) return tp("passed");
  if(n===0) return tp("today");
  if(n===1) return tp("tomorrow");
  return lang==="zh" ? ("还有 "+n+" 天") : ("in "+n+" days");
}
function fmtDate(s){
  const d=parseD(s);
  if(lang==="zh") return d.getFullYear()+"年"+MONTHS_ZH[d.getMonth()]+d.getDate()+"日";
  return d.getDate()+" "+MONTH_NAMES[d.getMonth()].slice(0,3)+" "+d.getFullYear();
}
function dowShort(d){ return lang==="zh" ? ("周"+DOW_ZH[d.getDay()]) : DOW[d.getDay()].slice(0,3); }
function monthLabel(d){
  return lang==="zh" ? (d.getFullYear()+"年"+MONTHS_ZH[d.getMonth()])
                     : (MONTH_NAMES[d.getMonth()]+" "+d.getFullYear());
}

function renderRail(){
  const track=document.getElementById("railTrack");
  const items=[];
  DAYS.forEach(day=>{
    allEventsFor(day).forEach(raw=>{
      const e=evView(raw);
      if(e.w==="normal") return;
      const n=daysUntil(day.d);
      if(n<0||n>21) return;
      items.push({n,d:day.d,t:e.t,id:e.id});
    });
  });
  items.sort((a,b)=>a.n-b.n);
  const label=document.getElementById("railCount");
  if(!items.length){
    track.innerHTML='<div class="rail-empty">'+bi("Nothing special inside the next three weeks — the diary below picks up again after that.")+'</div>';
    label.textContent="";
    return;
  }
  label.textContent = lang==="zh" ? (items.length+" 项") : (items.length+(items.length===1?" event":" events"));
  track.innerHTML=items.map(i=>
    '<button class="cd '+cdClass(i.n)+'" data-jump="'+esc(i.id)+'">'+
      '<span class="n"><b>'+(i.n===0?"0":i.n)+'</b><span>'+(i.n===0?tp("today"):(i.n===1?tp("day"):tp("days")))+'</span></span>'+
      '<span class="t"><b>'+bic(i.t)+'</b><span>'+esc(fmtDate(i.d))+'</span></span>'+
    '</button>').join("");
}

function renderDiary(){
  const host=document.getElementById("months");
  let html="";
  let lastMonth="";
  const today=todayMid();
  DAYS.forEach(day=>{
    const dt=parseD(day.d);
    const mk=dt.getFullYear()+"-"+dt.getMonth();
    if(mk!==lastMonth){
      if(lastMonth!=="") html+="</div>";
      const theme=day.monthTheme?'<span class="theme">'+bic(day.monthTheme)+'</span>':"";
      html+='<div class="month"><div class="month-bar"><h3>'+esc(monthLabel(dt))+"</h3>"+theme+'<span class="month-rule"></span></div>';
      lastMonth=mk;
    }
    const ov=state.days[day.d]||{};
    const past=dt<today;
    const evs=allEventsFor(day).map(evView);
    const heaviest = evs.some(e=>e.w==="milestone") ? "milestone" : (evs.some(e=>e.w==="major") ? "major" : "");
    const cls=["day",past?"past":"",heaviest].filter(Boolean).join(" ");

    const preacher = ov.preacher!==undefined?ov.preacher:(day.preacher||"");
    const passage  = ov.passage !==undefined?ov.passage :(day.passage||"");
    const note     = ov.note    !==undefined?ov.note    :"";
    const ED = EDITABLE ? " contenteditable" : "";

    html+='<div class="'+cls+'" id="day-'+day.d+'">';
    html+='<div class="daymark">';
    html+='<div class="dm-num">'+dt.getDate()+'</div>';
    html+='<div class="dm-dow">'+esc(dowShort(dt))+'</div>';
    html+='<div class="dm-lit">'+bi(day.lit)+'</div>';
    if(day.term) html+='<div class="dm-term">'+bic(day.term)+'</div>';
    if(day.leave) html+='<div class="dm-term">'+bic(day.leave)+'</div>';
    html+='</div>';

    html+='<div class="daybody">';
    if(day.kind==="sunday"||day.passage!==undefined){
      html+='<div class="service">';
      html+='<span class="svc-passage"'+ED+' data-k="day" data-id="'+day.d+'" data-f="passage" data-ph="'+esc(tp("passage to set"))+'">'+bic(passage)+'</span>';
      html+='<span class="svc-meta">'+(day.series?bic(day.series):"")+'</span>';
      html+='</div>';
      html+='<div class="svc-line2">';
      html+='<span>'+esc(tp("Preacher"))+': <em'+ED+' data-k="day" data-id="'+day.d+'" data-f="preacher" data-ph="'+esc(tp("to confirm"))+'">'+bic(preacher)+'</em></span>';
      if(day.psalm) html+='<span>'+esc(tp("Psalm"))+': <em>'+bic(day.psalm)+'</em></span>';
      if(day.engine) html+='<span>'+esc(tp("Engine"))+': <em>'+bic(day.engine)+'</em></span>';
      html+='</div>';
    }
    if(EDITABLE || note){
      html+='<div class="svc-line2"><span style="flex:1">'+esc(tp("Note"))+': <em'+ED+' data-k="day" data-id="'+day.d+'" data-f="note" data-ph="'+esc(tp("add a note for this day"))+'">'+esc(note)+'</em></span></div>';
    }

    html+='<div class="events">';
    evs.forEach(e=>{
      const en=daysUntil(day.d);
      const ecls=["ev", e.w==="major"?"is-major":(e.w==="normal"?"":"is-special"), e.status==="done"?"is-done":""].filter(Boolean).join(" ");
      html+='<div class="'+ecls+'" id="ev-'+esc(e.id)+'">';
      html+='<div class="ev-top">';
      html+='<div class="ev-title"'+ED+' data-k="ev" data-id="'+esc(e.id)+'" data-f="t" data-ph="'+esc(tp("event name"))+'">'+bi(e.t)+'</div>';
      html+='<div class="ev-when"'+ED+' data-k="ev" data-id="'+esc(e.id)+'" data-f="when" data-ph="'+esc(tp("time / place"))+'">'+bic(e.when)+'</div>';
      if(EDITABLE) html+='<button class="x" data-del="'+esc(e.id)+'" data-custom="'+(e.custom?"1":"0")+'" title="'+esc(tp("Hide this from the calendar"))+'">&times;</button>';
      html+='</div>';
      if(EDITABLE || e.detail)
        html+='<div class="ev-detail"'+ED+' data-k="ev" data-id="'+esc(e.id)+'" data-f="detail" data-ph="'+esc(tp("what this involves"))+'">'+bi(e.detail)+'</div>';
      html+='<div class="ev-foot">';
      if(e.w!=="normal") html+='<span class="cd-pill '+cdClass(en)+'">'+esc(cdText(en))+'</span>';
      if(e.team&&TEAMS[e.team]) html+='<a class="chip team" href="'+BOARD+'" target="_blank" rel="noopener">'+bic(TEAMS[e.team].name)+' &#9723;</a>';
      if(e.kog) html+='<a class="chip stage" href="'+CYCLE+'" target="_blank" rel="noopener">'+bic(e.kog)+' &#9678;</a>';
      if(e.path) html+='<span class="chip pathway static">'+bic(e.path)+'</span>';
      if(e.flag) html+='<span class="chip flag static">'+bic(e.flag)+'</span>';
      const slab = STATUS_LABEL[e.status] || "Planned";
      html+= EDITABLE
        ? '<select class="chip status" data-pick="ev" data-id="'+esc(e.id)+'" data-v="'+e.status+'" aria-label="Status">'
          + STATUS_STATES.map(v=>'<option value="'+v+'"'+(v===e.status?' selected':'')+'>'+esc(tp(STATUS_LABEL[v]))+'</option>').join("")
          + '</select>'
        : '<span class="chip status static" data-v="'+e.status+'">'+esc(tp(slab))+'</span>';
      html+='</div></div>';
    });
    if(EDITABLE) html+='<button class="addbtn" data-add="'+day.d+'">'+esc(tp("+ add an event"))+'</button>';
    html+='</div></div></div>';
  });
  if(lastMonth!=="") html+="</div>";
  const hc = hiddenCount();
  if(EDITABLE && hc) html+='<button class="addbtn restore" data-restore="1">'+esc(tp("Restore hidden items"))+' ('+hc+')</button>';
  host.innerHTML=html;
}

function renderPathway(){
  const g=document.getElementById("pathwayGrid");
  if(!g) return;
  g.innerHTML = PATHWAY.map(p=>
    '<div class="pstep"><div class="pstep-n">'+bic(p.n)+'</div><h4>'+bi(p.name)+'</h4><div class="zh">'+esc(p.zh)+'</div>'+
    '<ul>'+p.items.map(i=>"<li>"+bi(i)+"</li>").join("")+'</ul>'+
    '<div class="owner">'+esc(tp("Owner"))+' · '+bic(p.owner)+'</div></div>').join("");
  document.getElementById("stageRow").innerHTML =
    '<span class="rail-title" style="margin-right:4px">'+esc(tp("KOGCycle stages"))+'</span>' +
    STAGES.map(s=>'<a class="stage" href="'+CYCLE+'" target="_blank" rel="noopener">'+bic(s)+'</a>').join('<span class="arrow">&rarr;</span>');
}

function renderMilestones(){
  const ED = EDITABLE ? " contenteditable" : "";
  document.getElementById("milestoneGroups").innerHTML = MILESTONES.map(g=>
    '<div class="mgroup"><div class="mgroup-head"><h3>'+bi(g.group)+'</h3>'+
    (g.due?'<span class="due">'+bic(g.due)+'</span>':"")+
    '<span class="horizon">'+bic(g.horizon)+'</span></div>'+
    '<div class="mlist">'+g.items.map(m=>{
      const o=state.ms[m.id]||{};
      const s=o.s||m.s;
      const note=o.note!==undefined?o.note:m.note;
      const lab=MS_LABEL[s];
      return '<div class="ms" data-s="'+s+'">'+
        '<div class="ms-title">'+bi(m.t)+'</div>'+
        '<div class="ms-note"'+ED+' data-k="ms" data-id="'+esc(m.id)+'" data-f="note" data-ph="'+esc(tp("add a note"))+'">'+bi(note)+'</div>'+
        '<div class="ms-foot">'+
        (EDITABLE
          ? '<select class="sbadge" data-pick="ms" data-id="'+esc(m.id)+'" data-s="'+s+'" aria-label="Status">'
            + MS_STATES.map(v=>'<option value="'+v+'"'+(v===s?' selected':'')+'>'+esc(tp(MS_LABEL[v]))+'</option>').join("")
            + '</select>'
          : '<span class="sbadge" data-s="'+s+'">'+esc(tp(lab))+'</span>')+
        (g.due?'<span class="ms-when">'+esc(tp("by"))+' '+esc(tp(g.due))+'</span>':"")+'</div></div>';
    }).join("")+'</div></div>').join("");
}

function renderTeams(){
  const g=document.getElementById("teamGrid");
  if(!g) return;
  g.innerHTML = Object.entries(TEAMS).map(([k,tm])=>{
    const addrs=tm.people.filter(p=>p[1]).map(p=>p[1]);
    return '<div class="team" id="team-'+k+'">'+
      '<h4>'+esc(lang==="zh" ? (tm.zh||t(tm.name)) : tm.name)
        + (lang==="zh" ? "" : '<span class="zh">'+esc(tm.zh)+'</span>')+'</h4>'+
      '<div class="brief">'+bi(tm.brief)+'</div>'+
      '<div class="people">'+tm.people.map(p=> p[1]
        ? '<a class="person" href="mailto:'+esc(p[1])+'">'+esc(tp(p[0]))+'</a>'
        : '<span class="person noaddr" title="'+esc(tp("No address on file"))+'">'+esc(tp(p[0]))+' ·</span>').join("")+'</div>'+
      '<div class="teamlinks">'+
        (addrs.length>1?'<a class="mailall" href="mailto:'+addrs.join(",")+'">'+esc(tp("Email the whole team"))+'</a>':"")+
        '<a class="mailall" href="'+BOARD+'" target="_blank" rel="noopener">'+esc(tp("Their cards on the board"))+'</a>'+
      '</div>'+
    '</div>';
  }).join("");
}

function renderStatic(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.innerHTML = el.dataset.inline!==undefined ? bic(el.dataset.i18n) : bi(el.dataset.i18n);
  });
  document.getElementById("rhythm").innerHTML = RHYTHM.map(r=>
    '<div class="rrow"><div class="rt">'+bic(r[0])+'</div><div class="rd"><strong>'+bi(r[1])+'</strong><br><span>'+bi(r[2])+'</span></div></div>').join("");
  document.getElementById("agenda").innerHTML = AGENDA.map(a=>
    "<li>"+bi(a[0])+(a[1]?' — <span>'+bi(a[1])+"</span>":"")+"</li>").join("");
  document.getElementById("mtmOrder").innerHTML = MTM_ORDER.map(a=>
    "<li>"+bi(a[0])+(a[1]?' — <span>'+bi(a[1])+"</span>":"")+"</li>").join("");
  document.getElementById("openList").innerHTML = OPEN_ITEMS.map(o=>
    '<div class="oi"><div class="txt">'+bi(o.txt)+'</div><div class="who">'+esc(tp(o.who))+'</div></div>').join("");

  const tday=todayMid();
  const iso=tday.getFullYear()+"-"+String(tday.getMonth()+1).padStart(2,"0")+"-"+String(tday.getDate()).padStart(2,"0");
  document.getElementById("todayStamp").textContent =
    lang==="zh" ? (tp("Today")+" · 周"+DOW_ZH[tday.getDay()]+" "+fmtDate(iso))
                : ("Today · "+DOW[tday.getDay()]+" "+fmtDate(iso));
  const n=daysUntil("2026-12-31");
  document.getElementById("daysToMilestone").textContent = n>=0
    ? (lang==="zh" ? ("还有 "+n+" "+tp("days to the 75-household milestone")) : (n+" days to the 75-household milestone"))
    : tp("75-household milestone date passed");
}

function renderAll(){ renderRail(); renderDiary(); renderMilestones(); }

/* ======================= PERSISTENCE ======================= */
const BUCKET = {sundayNotes:"days", eventState:"events", customEvents:"custom", milestoneState:"ms"};
let chipTimer=null;
function flash(msg,warn){
  const c=document.getElementById("savechip");
  if(!c) return;
  c.textContent=tp(msg); c.classList.toggle("warn",!!warn); c.classList.add("show");
  clearTimeout(chipTimer); chipTimer=setTimeout(()=>c.classList.remove("show"),1600);
}
function readOnly(){
  document.body.classList.add("ro");
  document.getElementById("syncState").textContent=tp("Read only");
}
async function save(coll,id,patch){
  const bucket = state[BUCKET[coll]];
  // Snapshot bodies from the store are FROZEN — never mutate one in place
  // (under "use strict" that throws and the edit is silently lost).
  const body = Object.assign({}, bucket[id] || {}, patch);
  bucket[id] = body;
  if(!db||!canWrite){ flash("Saved in this window only",true); return; }
  try{
    await db.collection(coll).doc(id).set(JSON.parse(JSON.stringify(body)));
    flash("Saved");
  }catch(err){
    const code = err && err.code;
    if(code==="invalid_argument"||code==="not_granted"){ canWrite=false; readOnly(); flash("You don't have edit access",true); }
    else flash("Couldn't save — try again",true);
  }
}
async function remove(coll,id){
  delete state.custom[id];
  renderAll();
  if(!db||!canWrite) return;
  try{ await db.collection(coll).doc(id).delete(); flash("Removed"); }catch(e){}
}

/* ======================= EVENTS ======================= */
document.addEventListener("blur",ev=>{
  const el=ev.target;
  if(!el||!el.hasAttribute||!el.hasAttribute("contenteditable")) return;
  const k=el.dataset.k, id=el.dataset.id, f=el.dataset.f;
  if(!k||!id||!f) return;
  const val=el.textContent.trim();
  const patch={}; patch[f]=val;
  if(k==="day") save("sundayNotes",id,patch);
  else if(k==="ev"){ state.custom[id] ? save("customEvents",id,patch) : save("eventState",id,patch); }
  else if(k==="ms") save("milestoneState",id,patch);
},true);

document.addEventListener("keydown",ev=>{
  const el=ev.target;
  if(!el||!el.hasAttribute||!el.hasAttribute("contenteditable")) return;
  if(ev.key==="Enter" && !ev.shiftKey){ ev.preventDefault(); el.blur(); }
  if(ev.key==="Escape") el.blur();
});

document.addEventListener("click",ev=>{
  const lb=ev.target.closest("[data-lang-btn]");
  if(lb){ setLang(lb.dataset.langBtn); return; }

  const jump=ev.target.closest("[data-jump]");
  if(jump){
    const el=document.getElementById("ev-"+jump.dataset.jump);
    if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.style.boxShadow="0 0 0 3px var(--coral)"; setTimeout(()=>{el.style.boxShadow="";},1400); }
    return;
  }
  if(!EDITABLE) return;

  const rst=ev.target.closest("[data-restore]");
  if(rst){
    Object.entries(state.events).forEach(([id,o])=>{
      if(o&&o.hidden) save("eventState",id,{hidden:false});
    });
    renderAll();
    return;
  }
  const add=ev.target.closest("[data-add]");
  if(add){
    const date=add.dataset.add;
    const id="c-"+date+"-"+Math.random().toString(36).slice(2,8);
    state.custom[id]={date,t:"New event",when:"",team:"",path:"",kog:"",w:"special",detail:"",status:"planned"};
    save("customEvents",id,state.custom[id]);
    renderAll();
    setTimeout(()=>{
      const card=document.getElementById("ev-"+id);
      const el=card&&card.querySelector('[data-f="t"]');
      if(el){ el.focus(); document.getSelection().selectAllChildren(el); }
    },40);
    return;
  }
  const del=ev.target.closest("[data-del]");
  if(del){
    const id=del.dataset.del;
    if(del.dataset.custom==="1") remove("customEvents",id);
    else { save("eventState",id,{hidden:true}); renderAll(); }
    return;
  }
});

/* status pickers */
document.addEventListener("change",ev=>{
  const sel=ev.target.closest("[data-pick]");
  if(!sel||!EDITABLE) return;
  const id=sel.dataset.id, v=sel.value;
  if(sel.dataset.pick==="ms"){ save("milestoneState",id,{s:v}); renderMilestones(); }
  else { if(state.custom[id]) save("customEvents",id,{status:v}); else save("eventState",id,{status:v}); renderAll(); }
});

/* ======================= BOOT ======================= */
setLang(lang);
document.getElementById("syncState").textContent = "";

let lastDay=todayMid().getTime();
setInterval(()=>{
  const now=todayMid().getTime();
  if(now!==lastDay){ lastDay=now; renderStatic(); renderAll(); }
},60000);

</script>
